{
  "schema_version": "1.1",
  "name": "missing-tools",
  "plugins": [
    "../../../plugin"
  ],
  "runs": 1,
  "tags": [
    "offline-smoke"
  ],
  "execution": {
    "prompt": "Use VibeLeads to plan a company-first search for five Austin dental clinics with visible website accessibility problems. This host has no local shell, Python or authenticated collection tool; no imported records were provided. Do not claim you installed a runtime or found real prospects. Give a useful source/qualification plan and one concrete setup action. No paid collection, login, fabricated email or account request just to plan.",
    "max_turns": 8,
    "timeout_seconds": 150,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "useful-plan",
      "type": "regex",
      "pattern": "dental|clinic",
      "flags": "i"
    },
    {
      "name": "honest-tool-boundary",
      "type": "regex",
      "pattern": "tool|runtime|access|import",
      "flags": "i"
    },
    {
      "name": "no-new-collection",
      "type": "tool_used",
      "tool": "Bash",
      "input_match": "apify.*(?:POST|actors start)",
      "min": 0,
      "max": 0
    }
  ]
}
