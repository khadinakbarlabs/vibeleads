name: Distribution checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests
      - run: node connector/tests/check-plugin.mjs
      - run: python3 scripts/package_distribution.py --output "$RUNNER_TEMP/release"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      HUSKY: '0'
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      ANTHROPIC_API_KEY: ci-placeholder
      APIFY_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsx --test tests/*.test.ts
      - run: pnpm verify:production
      - run: pnpm typecheck
